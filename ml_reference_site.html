<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=DM+Sans:wght@400;500;600&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --sk-orange:#f7931e;--tf-blue:#ff6f00;--pt-red:#ee4c2c;--r-blue:#276dc3;
    --dark:#12121c;--mid:#1a1a2e;--panel:#1e1e30;--border:rgba(255,255,255,0.07);
    --text:#e0e0f0;--muted:#8080a8;--green:#4ade80;--purple:#c084fc;--cyan:#67e8f9;
    font-family:'DM Sans',sans-serif;
  }
  html,body{height:100%;margin:0;padding:0}
  .wrap{display:flex;height:100vh;background:var(--dark);color:var(--text);border-radius:0;overflow:hidden;font-size:14px}
  .sidebar{width:210px;min-width:210px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
  .logo-area{padding:14px 14px 10px;border-bottom:1px solid var(--border)}
  .logo-row{display:flex;align-items:center;gap:8px}
  .logo-icon{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:600;font-size:11px;color:#fff;flex-shrink:0}
  .logo-title{font-size:14px;font-weight:600;color:var(--text)}
  .logo-sub{font-size:10px;color:var(--muted);margin-top:1px}
  .lib-switcher{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid var(--border);flex-wrap:wrap}
  .lib-btn{flex:1;min-width:40px;padding:5px 4px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:10px;font-weight:600;cursor:pointer;text-align:center;transition:all .15s;font-family:'DM Sans',sans-serif}
  .lib-btn.active{color:#fff;border-color:transparent}
  .lib-btn[data-lib=sklearn].active{background:var(--sk-orange)}
  .lib-btn[data-lib=tf].active{background:var(--tf-blue)}
  .lib-btn[data-lib=pt].active{background:var(--pt-red)}
  .lib-btn[data-lib=r].active{background:var(--r-blue)}
  .sidebar-search{padding:8px 10px;border-bottom:1px solid var(--border)}
  .sidebar-search input{width:100%;background:var(--mid);border:1px solid var(--border);border-radius:6px;padding:5px 9px;color:var(--text);font-size:12px;font-family:'DM Sans',sans-serif;outline:none}
  .sidebar-search input:focus{border-color:rgba(255,255,255,0.2)}
  .sidebar-search input::placeholder{color:var(--muted)}
  .sidebar-nav{overflow-y:auto;flex:1;padding:6px 0;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
  .nav-group{margin-bottom:2px}
  .nav-label{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:6px 14px 3px}
  .nav-item{display:flex;align-items:center;gap:7px;padding:5px 14px;cursor:pointer;border-left:2px solid transparent;font-size:12px;color:var(--text);transition:background .12s}
  .nav-item:hover{background:rgba(255,255,255,0.04)}
  .nav-item.active{border-left-color:currentColor;background:rgba(255,255,255,0.06)}
  .nav-item.active[data-lib=sklearn]{color:var(--sk-orange)}
  .nav-item.active[data-lib=tf]{color:var(--tf-blue)}
  .nav-item.active[data-lib=pt]{color:var(--pt-red)}
  .nav-item.active[data-lib=r]{color:var(--r-blue)}
  .nav-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;background:currentColor;opacity:.6}
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .topbar{background:var(--mid);border-bottom:1px solid var(--border);padding:10px 18px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
  .topbar-left .title{font-size:15px;font-weight:600}
  .topbar-left .crumb{font-size:11px;color:var(--muted);margin-top:2px}
  .top-badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500;border:1px solid;background:rgba(255,255,255,0.05)}
  .content{flex:1;overflow-y:auto;padding:16px 20px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
  .page{display:none}.page.active{display:block}
  .hero{border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:18px;position:relative;overflow:hidden}
  .hero-title{font-size:20px;font-weight:600;margin-bottom:6px}
  .hero-sub{font-size:12px;color:var(--muted);line-height:1.6;max-width:440px}
  .stat-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .stat{background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:7px;padding:7px 12px;font-size:11px}
  .stat strong{font-size:16px;font-weight:600;display:block}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:16px}
  .topic-card{background:var(--mid);border:1px solid var(--border);border-radius:9px;padding:12px;cursor:pointer;transition:all .18s;text-align:center}
  .topic-card:hover{transform:translateY(-2px);border-color:rgba(255,255,255,0.2)}
  .topic-icon{font-size:20px;margin-bottom:5px}
  .topic-title{font-size:12px;font-weight:500}
  .topic-count{font-size:10px;color:var(--muted);margin-top:2px}
  .fcard{background:var(--mid);border:1px solid var(--border);border-radius:9px;margin-bottom:16px;overflow:hidden;transition:border-color .18s}
  .fcard:hover{border-color:rgba(255,255,255,0.15)}
  .fcard-head{padding:12px 16px 10px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .fname{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600}
  .ftag{font-size:10px;color:var(--muted);margin-top:2px}
  .fbadge{font-size:9px;padding:3px 7px;border-radius:4px;font-weight:600;flex-shrink:0;border:1px solid;margin-top:2px}
  .fdesc{padding:0 16px 10px;font-size:12px;color:var(--text);line-height:1.6}
  .code-block{background:#0d0d1a;border-top:1px solid var(--border);position:relative}
  .ctabs{display:flex;padding:0 14px;border-bottom:1px solid var(--border)}
  .ctab{font-size:11px;padding:6px 10px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .12s}
  .ctab.active{color:var(--cyan);border-bottom-color:var(--cyan)}
  .cpanel{display:none}.cpanel.active{display:block}
  pre{font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.7;padding:12px 16px;overflow-x:auto;white-space:pre}
  .kw{color:#ff79c6}.fn{color:var(--cyan)}.st{color:#f1fa8c}.nu{color:#ffb86c}.cm{color:#555577;font-style:italic}.op{color:var(--muted)}.out{color:var(--green)}.bi{color:var(--purple)}.cl{color:#8be9fd}.at{color:#50fa7b}
  .callout{border-left:2px solid;padding:8px 12px;border-radius:0 7px 7px 0;font-size:12px;line-height:1.6;margin-bottom:14px}
  .callout-tip{border-color:var(--green);background:rgba(74,222,128,.06)}
  .callout-note{border-color:var(--cyan);background:rgba(103,232,249,.06)}
  .callout-warn{border-color:#fbbf24;background:rgba(251,191,36,.06)}
  .clabel{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}
  .callout-tip .clabel{color:var(--green)}.callout-note .clabel{color:var(--cyan)}.callout-warn .clabel{color:#fbbf24}
  .sh{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px;display:flex;align-items:center;gap:8px;color:var(--muted)}
  .sh::after{content:'';flex:1;height:1px;background:var(--border)}
  .compare-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
  .compare-card{border:1px solid var(--border);border-radius:9px;padding:12px;background:var(--panel)}
  .compare-card h4{font-size:13px;font-weight:600;margin-bottom:8px}
  .compare-card ul{list-style:none;font-size:11px;color:var(--muted);line-height:1.8}
  .compare-card ul li::before{content:'→ ';color:var(--cyan)}
  .pill{display:inline-block;font-size:10px;padding:2px 8px;border-radius:20px;border:1px solid;margin:2px 2px 2px 0}
  .quiz-card{background:var(--mid);border:1px solid var(--border);border-radius:9px;padding:16px;margin-bottom:12px}
  .quiz-q{font-size:13px;font-weight:500;margin-bottom:12px;line-height:1.5}
  .quiz-opts{display:flex;flex-direction:column;gap:6px}
  .qopt{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:6px;padding:8px 12px;cursor:pointer;font-size:12px;font-family:'JetBrains Mono',monospace;transition:all .12s}
  .qopt:hover{border-color:rgba(255,255,255,0.2);background:rgba(255,255,255,0.06)}
  .qopt.correct{border-color:var(--green);background:rgba(74,222,128,.1);color:var(--green)}
  .qopt.wrong{border-color:#f87171;background:rgba(248,113,113,.1);color:#f87171}
  .qexp{margin-top:10px;font-size:11px;color:var(--muted);padding:8px;background:rgba(255,255,255,0.03);border-radius:5px;display:none;line-height:1.6}
  .pbar-wrap{background:rgba(255,255,255,0.06);border-radius:20px;height:5px;margin-bottom:16px;overflow:hidden}
  .pbar{height:100%;border-radius:20px;background:var(--cyan);transition:width .4s ease}
  .cheat-tbl{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:16px}
  .cheat-tbl th{background:var(--panel);color:var(--muted);padding:7px 10px;text-align:left;font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border)}
  .cheat-tbl td{padding:7px 10px;border-bottom:1px solid rgba(255,255,255,0.03);vertical-align:top}
  .cheat-tbl tr:hover td{background:rgba(255,255,255,0.02)}
  .cheat-tbl td:first-child{font-family:'JetBrains Mono',monospace;color:var(--cyan)}
  .cheat-tbl td:nth-child(2){color:var(--muted)}
  .cheat-tbl td:nth-child(3){font-family:'JetBrains Mono',monospace;color:#f1fa8c;font-size:10px}
  .pg-bar{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .pg-bar select{background:var(--mid);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:4px 8px;font-size:12px;font-family:'DM Sans',sans-serif;outline:none;cursor:pointer}
  .editor-wrap{background:#0d0d1a;border:1px solid var(--border);border-radius:9px;overflow:hidden;margin-bottom:14px}
  .editor-bar{background:var(--panel);padding:7px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
  .editor-dots{display:flex;gap:4px}
  .editor-dot{width:9px;height:9px;border-radius:50%}
  .run-btn{background:var(--green);color:#0d0d1a;border:none;border-radius:5px;padding:3px 10px;font-size:11px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:opacity .12s}
  .run-btn:hover{opacity:.85}
  textarea.ced{width:100%;background:#0d0d1a;color:var(--text);border:none;outline:none;font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.7;padding:12px 16px;resize:vertical;min-height:130px}
  .eout{border-top:1px solid var(--border);padding:10px 16px;font-family:'JetBrains Mono',monospace;font-size:11px;min-height:40px;white-space:pre-wrap}
  .outlabel{font-size:9px;color:var(--muted);font-family:'DM Sans',sans-serif;margin-bottom:3px;text-transform:uppercase;letter-spacing:.06em}
</style>

      <div class="logo-row">

        <div>
          <div class="logo-title" id="logoTitle">ML Reference</div>

      <div class="top-badge" id="topBadge" style="color:var(--sk-orange);border-color:var(--sk-orange)">sklearn</div>

</div>

<script>
const LIBS = {
  sklearn: {
    label:'Scikit-learn', short:'sklearn', color:'#f7931e', icon:'SK',
    pages: [
      { id:'home', label:'Overview', group:'Start here' },
      { id:'cheat', label:'Cheat Sheet', group:'Start here' },
      { id:'quiz', label:'Quiz', group:'Start here' },
      { id:'linear', label:'Linear Regression', group:'Supervised' },
      { id:'logistic', label:'Logistic Regression', group:'Supervised' },
      { id:'trees', label:'Decision Trees / RF', group:'Supervised' },
      { id:'svm', label:'SVM', group:'Supervised' },
      { id:'knn', label:'K-Nearest Neighbors', group:'Supervised' },
      { id:'kmeans', label:'K-Means Clustering', group:'Unsupervised' },
      { id:'pipeline', label:'Pipeline & Preprocessing', group:'Workflow' },
      { id:'metrics', label:'Model Evaluation', group:'Workflow' },
    ]
  },
  tf: {
    label:'TensorFlow / Keras', short:'TF', color:'#ff6f00', icon:'TF',
    pages: [
      { id:'home', label:'Overview', group:'Start here' },
      { id:'cheat', label:'Cheat Sheet', group:'Start here' },
      { id:'quiz', label:'Quiz', group:'Start here' },
      { id:'tensors', label:'Tensors & Variables', group:'Basics' },
      { id:'keras', label:'Keras Sequential API', group:'Models' },
      { id:'functional', label:'Functional API', group:'Models' },
      { id:'training', label:'Training Loop', group:'Training' },
      { id:'callbacks', label:'Callbacks', group:'Training' },
      { id:'cnn', label:'CNN for Images', group:'Applications' },
      { id:'save', label:'Saving & Loading', group:'Workflow' },
    ]
  },
  pt: {
    label:'PyTorch', short:'PyTorch', color:'#ee4c2c', icon:'PT',
    pages: [
      { id:'home', label:'Overview', group:'Start here' },
      { id:'cheat', label:'Cheat Sheet', group:'Start here' },
      { id:'quiz', label:'Quiz', group:'Start here' },
      { id:'tensors', label:'Tensors', group:'Basics' },
      { id:'autograd', label:'Autograd', group:'Basics' },
      { id:'nn', label:'nn.Module', group:'Models' },
      { id:'dataloader', label:'DataLoader & Dataset', group:'Data' },
      { id:'training', label:'Training Loop', group:'Training' },
      { id:'optim', label:'Optimizers & Schedulers', group:'Training' },
      { id:'save', label:'Saving & Loading', group:'Workflow' },
    ]
  },
  r: {
    label:'R Language', short:'R', color:'#276dc3', icon:'R',
    pages: [
      { id:'home', label:'Overview', group:'Start here' },
      { id:'cheat', label:'Cheat Sheet', group:'Start here' },
      { id:'quiz', label:'Quiz', group:'Start here' },
      { id:'vectors', label:'Vectors & Data Types', group:'Basics' },
      { id:'dataframe', label:'Data Frames', group:'Data' },
      { id:'dplyr', label:'dplyr (tidyverse)', group:'Data' },
      { id:'ggplot', label:'ggplot2 Visualization', group:'Visualization' },
      { id:'lm', label:'Linear Models (lm)', group:'Stats' },
      { id:'tidyr', label:'tidyr & reshape', group:'Data' },
      { id:'ml', label:'caret / tidymodels ML', group:'ML' },
    ]
  }
};

const CONTENT = {
  sklearn: {
    home: `<div class="hero" style="border-color:rgba(247,147,30,.3)">
      <div class="hero-title" style="color:#f7931e">Scikit-learn Reference</div>
      <div class="hero-sub">The gold standard ML library for Python. Simple, consistent API for classical machine learning — from linear regression to ensemble methods.</div>
      <div class="stat-row">
        <div class="stat"><strong style="color:#f7931e">10+</strong>Algorithms</div>
        <div class="stat"><strong style="color:#f7931e">1</strong>Consistent API</div>
        <div class="stat"><strong style="color:#f7931e">fit/predict</strong>Pattern</div>
      </div>
    </div>
    <div class="sh">Topics</div>
    <div class="grid2">
      <div class="topic-card" onclick="showPage('linear')"><div class="topic-icon">📈</div><div class="topic-title">Linear Regression</div><div class="topic-count">Continuous output</div></div>
      <div class="topic-card" onclick="showPage('logistic')"><div class="topic-icon">🔀</div><div class="topic-title">Logistic Regression</div><div class="topic-count">Classification</div></div>
      <div class="topic-card" onclick="showPage('trees')"><div class="topic-icon">🌲</div><div class="topic-title">Trees & Forests</div><div class="topic-count">Ensemble methods</div></div>
      <div class="topic-card" onclick="showPage('pipeline')"><div class="topic-icon">🔧</div><div class="topic-title">Pipeline</div><div class="topic-count">Clean workflow</div></div>
      <div class="topic-card" onclick="showPage('metrics')"><div class="topic-icon">📊</div><div class="topic-title">Evaluation</div><div class="topic-count">Metrics & CV</div></div>
      <div class="topic-card" onclick="showPage('kmeans')"><div class="topic-icon">🔵</div><div class="topic-title">K-Means</div><div class="topic-count">Unsupervised</div></div>
    </div>
    <div class="callout callout-tip"><div class="clabel">Core pattern</div>Every sklearn model follows the same 3 steps: <code style="color:#f7931e">model.fit(X_train, y_train)</code> → <code style="color:#f7931e">model.predict(X_test)</code> → evaluate. Learn this once, use everywhere.</div>`,

    linear: `<div class="callout callout-note"><div class="clabel">Linear Regression</div>Predicts a continuous numeric value. The model finds the best-fit line through your data by minimising mean squared error.</div>
    <div class="fcard">
      <div class="fcard-head"><div><div class="fname" style="color:#f7931e">LinearRegression()</div><div class="ftag">Fit a line to continuous data</div></div><div class="fbadge" style="color:#f7931e;border-color:#f7931e">supervised</div></div>
      <div class="fdesc">Fits a linear model <code style="color:#f7931e">y = Xw + b</code>. No hyperparameters to tune for basic use. Great baseline before trying complex models. Use <code style="color:#f7931e">Ridge</code> or <code style="color:#f7931e">Lasso</code> if you need regularization.</div>
      <div class="code-block"><div class="ctabs"><div class="ctab active" onclick="ct(this,'sk-lr-c')">Code</div><div class="ctab" onclick="ct(this,'sk-lr-o')">Output</div></div>
      <div class="cpanel active" id="sk-lr-c"><pre><span class="kw">from</span> sklearn.linear_model <span class="kw">import</span> <span class="cl">LinearRegression</span>
<span class="kw">from</span> sklearn.model_selection <span class="kw">import</span> train_test_split
<span class="kw">from</span> sklearn.metrics <span class="kw">import</span> mean_squared_error
<span class="kw">import</span> numpy <span class="kw">as</span> np

<span class="cm"># Sample data: house size → price</span>
X = np.array([[500],[750],[1000],[1250],[1500]])
y = np.array([150000, 200000, 250000, 310000, 370000])

X_train, X_test, y_train, y_test = train_test_split(
    X, y, test_size=<span class="nu">0.2</span>, random_state=<span class="nu">42</span>)

model = <span class="cl">LinearRegression</span>()
model.fit(X_train, y_train)

y_pred = model.predict(X_test)
mse = mean_squared_error(y_test, y_pred)

<span class="bi">print</span>(<span class="kw">f</span><span class="st">"Coefficient: {model.coef_[0]:.2f}"</span>)
<span class="bi">print</span>(<span class="kw">f</span><span class="st">"Intercept:   {model.intercept_:.2f}"</span>)
<span class="bi">print</span>(<span class="kw">f</span><span class="st">"MSE:         {mse:.2f}"</span>)</pre></div>
      <div class="cpanel" id="sk-lr-o"><pre><span class="out">Coefficient: 225.00
Intercept:   37500.00
MSE:         25000000.00</span></pre></div></div>
    </div>
    <div class="fcard">
      <div class="fcard-head"><div><div class="fname" style="color:#f7931e">Ridge / Lasso</div><div class="ftag">Regularized linear regression</div></div><div class="fbadge" style="color:#f7931e;border-color:#f7931e">regularization</div></div>
      <div class="fdesc"><code style="color:#f7931e">Ridge</code> adds L2 penalty (shrinks coefficients). <code style="color:#f7931e">Lasso</code> adds L1 penalty (can zero out coefficients — built-in feature selection). Both take an <code style="color:#f7931e">alpha</code> hyperparameter.</div>
      <div class="code-block"><div class="ctabs"><div class="ctab active" onclick="ct(this,'sk-ridge-c')">Code</div><div class="ctab" onclick="ct(this,'sk-ridge-o')">Output</div></div>
      <div class="cpanel active" id="sk-ridge-c"><pre><span class="kw">from</span> sklearn.linear_model <span class="kw">import</span> <span class="cl">Ridge</span>, <span class="cl">Lasso</span>

ridge = <span class="cl">Ridge</span>(alpha=<span class="nu">1.0</span>)
lasso = <span class="cl">Lasso</span>(alpha=<span class="nu">0.1</span>)

ridge.fit(X_train, y_train)
lasso.fit(X_train, y_train)

<span class="bi">print</span>(<span class="st">"Ridge coef:"</span>, ridge.coef_)
<span class="bi">print</span>(<span class="st">"Lasso coef:"</span>, lasso.coef_)
<span class="bi">print</span>(<span class="st">"Ridge R²:"</span>, ridge.score(X_test, y_test).round(<span class="nu">4</span>))</pre></div>
      <div class="cpanel" id="sk-ridge-o"><pre><span class="out">Ridge coef: [223.8]
Lasso coef: [220.1]
Ridge R²: 0.9823</span></pre></div></div>

    training: `<div class="fcard">
      <div class="fcard-head"><div><div class="fname" style="color:#ee4c2c">The PyTorch Training Loop</div><div class="ftag">Full manual control over every step</div></div><div class="fbadge" style="color:#ee4c2c;border-color:#ee4c2c">training</div></div>
      <div class="code-block"><div class="ctabs"><div class="ctab active" onclick="ct(this,'pt-tr-c')">Code</div><div class="ctab" onclick="ct(this,'pt-tr-o')">Output</div></div>
      <div class="cpanel active" id="pt-tr-c"><pre>optimizer = torch.optim.Adam(model.parameters(), lr=<span class="nu">1e-3</span>)
criterion = nn.CrossEntropyLoss()

<span class="kw">def</span> <span class="fn">train_epoch</span>(model, loader, optimizer):
    model.train()
    total_loss = <span class="nu">0</span>
    <span class="kw">for</span> X_batch, y_batch <span class="kw">in</span> loader:
        optimizer.zero_grad()       <span class="cm"># clear gradients</span>
        preds = model(X_batch)      <span class="cm"># forward pass</span>
        loss  = criterion(preds, y_batch)
        loss.backward()             <span class="cm"># backprop</span>
        optimizer.step()            <span class="cm"># update weights</span>
        total_loss += loss.item()
    <span class="kw">return</span> total_loss / <span class="bi">len</span>(loader)

<span class="kw">for</span> epoch <span class="kw">in</span> <span class="bi">range</span>(<span class="nu">5</span>):
    loss = <span class="fn">train_epoch</span>(model, loader, optimizer)
    <span class="bi">print</span>(<span class="kw">f</span><span class="st">"Epoch {epoch+1}: loss={loss:.4f}"</span>)</pre></div>

const QUIZZES = {
  sklearn: [
    {q:'Which sklearn method is used to train a model?',opts:['.train()','.fit()','.learn()','.run()'],ans:1,exp:'All sklearn estimators use .fit(X_train, y_train) to train.'},
    {q:'What does cross_val_score() do?',opts:['Scales features','Splits data once','Runs k-fold CV','Tunes hyperparams'],ans:2,exp:'cross_val_score runs k-fold cross-validation and returns a score for each fold.'},
    {q:'Which class prevents data leakage when combining a scaler and model?',opts:['ColumnTransformer','Pipeline','GridSearchCV','StandardScaler'],ans:1,exp:'Pipeline chains steps — the scaler is fit only on training data during cross-validation.'},
    {q:'What does RandomForest\'s feature_importances_ tell you?',opts:['Accuracy per feature','How much each feature reduces impurity','Feature correlation','P-values'],ans:1,exp:'Feature importances measure the mean decrease in impurity (Gini/entropy) from splitting on each feature.'},
    {q:'What does KMeans.inertia_ measure?',opts:['Cluster count','Within-cluster sum of squares','Silhouette score','Number of iterations'],ans:1,exp:'Inertia is the sum of squared distances from each point to its nearest cluster centroid.'},
  ],
  tf: [
    {q:'What does model.compile() configure?',opts:['Model architecture','Optimizer, loss, and metrics','Batch size','Number of epochs'],ans:1,exp:'compile() sets up the optimizer, loss function, and metrics before training begins.'},
    {q:'What callback stops training when val_loss stops improving?',opts:['ModelCheckpoint','ReduceLROnPlateau','EarlyStopping','TensorBoard'],ans:2,exp:'EarlyStopping monitors a metric and stops training when it stops improving for N patience epochs.'},
    {q:'What is the difference between tf.Tensor and tf.Variable?',opts:['Variables are faster','Tensors are mutable, Variables are not','Variables are mutable, Tensors are not','No difference'],ans:2,exp:'tf.Variable is mutable (used for model weights). tf.Tensor is immutable.'},
    {q:'Which Keras layer should you add to reduce overfitting?',opts:['BatchNormalization','MaxPooling2D','Dropout','Flatten'],ans:2,exp:'Dropout randomly zeros out units during training, acting as regularization.'},
    {q:'What activation function is standard for multiclass output layers?',opts:['relu','sigmoid','tanh','softmax'],ans:3,exp:'Softmax outputs a probability distribution over classes that sums to 1.'},
  ],
  pt: [
    {q:'Why call optimizer.zero_grad() before each training step?',opts:['To free GPU memory','Gradients accumulate by default — must be cleared','To reset the model','Required by PyTorch API'],ans:1,exp:'PyTorch accumulates gradients. zero_grad() clears them so each step only considers the current batch.'},
    {q:'What does .backward() do?',opts:['Forward pass','Computes gradients via backprop','Updates weights','Resets the model'],ans:1,exp:'.backward() computes gradients of the loss with respect to all parameters with requires_grad=True.'},
    {q:'What is the difference between model.train() and model.eval()?',opts:['Speed only','Affects Dropout and BatchNorm behavior','Changes the optimizer','Only cosmetic'],ans:1,exp:'model.eval() disables Dropout and uses running stats for BatchNorm — critical for correct inference.'},
    {q:'Which is the recommended way to save a PyTorch model?',opts:['torch.save(model)','torch.save(model.state_dict())','pickle.dump(model)','model.export()'],ans:1,exp:'Saving state_dict() is preferred — it is more portable and does not depend on the class definition location.'},
    {q:'What does requires_grad=True do on a tensor?',opts:['Moves it to GPU','Tells PyTorch to track operations for autograd','Freezes the tensor','Makes it a Variable'],ans:1,exp:'requires_grad=True tells the autograd engine to record operations on this tensor to enable .backward().'},
  ],
  r: [
    {q:'What is the index of the first element in an R vector?',opts:['0','1','-1','None'],ans:1,exp:'R uses 1-based indexing unlike Python. v[1] gives the first element.'},

  ]
};

let curLib = 'sklearn';
let curPage = 'home';
let qScore = 0, qAnswered = 0;

function buildNav(lib) {
  const nav = document.getElementById('sidebarNav');
  const pages = LIBS[lib].pages;
  const groups = {};
  pages.forEach(p => { if (!groups[p.group]) groups[p.group] = []; groups[p.group].push(p); });
  nav.innerHTML = Object.entries(groups).map(([g, ps]) =>
    `<div class="nav-group"><div class="nav-label">${g}</div>${ps.map(p =>
      `<div class="nav-item${p.id===curPage?' active':''}" data-lib="${lib}" onclick="showPage('${p.id}')">${p.label}</div>`
    ).join('')}</div>`
  ).join('');
}

function switchLib(lib, btn) {
  curLib = lib;
  curPage = 'home';
  document.querySelectorAll('.lib-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const L = LIBS[lib];
  document.getElementById('logoIcon').textContent = L.icon;
  document.getElementById('logoIcon').style.background = L.color;
  document.getElementById('logoTitle').textContent = L.label;
  buildNav(lib);
  showPage('home');
}

function showPage(id) {
  curPage = id;
  const lib = LIBS[curLib];
  const pageData = LIBS[curLib].pages.find(p=>p.id===id);
  document.getElementById('topTitle').textContent = pageData ? pageData.label : id;
  document.getElementById('topCrumb').textContent = `${lib.label} → ${pageData ? pageData.label : id}`;
  document.getElementById('topBadge').textContent = lib.short;
  document.getElementById('topBadge').style.color = lib.color;
  document.getElementById('topBadge').style.borderColor = lib.color;
  const cont = CONTENT[curLib];
  const html = cont && cont[id] ? cont[id] : `<div class="callout callout-note"><div class="clabel">Coming soon</div>This section is being added.</div>`;
  document.getElementById('mainContent').innerHTML = html;
  document.getElementById('mainContent').scrollTop = 0;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => { if (n.textContent.trim() === (pageData ? pageData.label : id)) n.classList.add('active'); });
  if (id === 'quiz') initQuiz();
}

function ct(el, panelId) {
  const block = el.closest('.code-block');
  block.querySelectorAll('.ctab').forEach(t=>t.classList.remove('active'));
  block.querySelectorAll('.cpanel').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  const p = document.getElementById(panelId);
  if (p) p.classList.add('active');
}

function filterNav(q) {
  document.querySelectorAll('.nav-item').forEach(n => {
    n.style.display = !q || n.textContent.toLowerCase().includes(q.toLowerCase()) ? '' : 'none';
  });
}

function initQuiz() {
  qScore = 0; qAnswered = 0;
  const qs = QUIZZES[curLib] || [];
  const color = LIBS[curLib].color;
  const container = document.getElementById('qc');
  if (!container) return;
  document.getElementById('qs').textContent = '0';
  document.getElementById('qt').textContent = '0';
  document.getElementById('qp').style.width = '0%';
  container.innerHTML = qs.map((q, qi) => `
    <div class="quiz-card" id="qcard-${qi}">
      <div class="quiz-q">${qi+1}. ${q.q}</div>
      <div class="quiz-opts">${q.opts.map((o, oi) =>
        `<div class="qopt" id="qo-${qi}-${oi}" onclick="answerQ(${qi},${oi})">
          <span style="color:var(--muted);margin-right:6px">${['A','B','C','D'][oi]}.</span>${o}
        </div>`
      ).join('')}</div>
      <div class="qexp" id="qe-${qi}">${q.exp}</div>
    </div>`).join('');
}

function answerQ(qi, oi) {
  const card = document.getElementById('qcard-'+qi);
  if (card.dataset.done) return;
  card.dataset.done = '1';
  const qs = QUIZZES[curLib];
  const correct = qs[qi].ans;
  qAnswered++;
  if (oi === correct) { qScore++; document.getElementById(`qo-${qi}-${oi}`).classList.add('correct'); }
  else { document.getElementById(`qo-${qi}-${oi}`).classList.add('wrong'); document.getElementById(`qo-${qi}-${correct}`).classList.add('correct'); }
  document.getElementById('qe-'+qi).style.display = 'block';
  document.getElementById('qs').textContent = qScore;
  document.getElementById('qt').textContent = qAnswered;
  document.getElementById('qp').style.width = (qAnswered / qs.length * 100) + '%';
}

buildNav('sklearn');
showPage('home');
</script>
